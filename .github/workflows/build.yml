name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Build app
        run: |
          set -x
          TMP="$RUNNER_TEMP/NicheLoader"
          xcodebuild \
            -project NicheLoader.xcodeproj \
            -scheme NicheLoader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$TMP" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          ls -la "$TMP/Build/Products/Release-iphoneos/" || true

      - name: Package IPA
        run: |
          set -x
          TMP="$RUNNER_TEMP/NicheLoader"
          STAGE="$TMP/stage"
          APP="$TMP/Build/Products/Release-iphoneos"
          rm -rf Payload "$STAGE"
          mkdir -p "$STAGE/Payload"
          mv "$APP/NicheLoader.app" "$STAGE/Payload/NicheLoader.app"
          chmod -R 0755 "$STAGE/Payload/NicheLoader.app"
          codesign --force --sign - --timestamp=none "$STAGE/Payload/NicheLoader.app" || true
          rm -rf "$STAGE/Payload/NicheLoader.app/_CodeSignature"
          mkdir -p packages
          cd "$STAGE" && zip -r9 "$GITHUB_WORKSPACE/packages/NicheLoader.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/packages/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NicheLoader-ipa
          path: packages/NicheLoader.ipa
